# Veriler telefondan gelir (telefon/guncelle.sh), çünkü TBF sitesi GitHub sunucularını engelliyor.
# Bu iş her gönderimde kadrolar.csv'yi işler ve siteyi GitHub Pages'te yayınlar.
name: Kadroları işle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  kadrolar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kadroları işle
        # Hatalı bir kadro satırı yayını durdurmasın; hata bu adımda görünür
        continue-on-error: true
        run: python kadro_hazirla.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "tbl-fantezi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m "Kadrolar güncellendi"
            git pull --rebase
            git push
          fi

  yayinla:
    needs: kadrolar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: yayin
        uses: actions/deploy-pages@v4
