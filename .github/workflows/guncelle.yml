# Her 10 dakikada bir TBF'den VP verilerini çeker (maç saatleri dışında kendini atlar),
# kadrolar.csv değiştiyse kadroları işler ve siteyi GitHub Pages'te yayınlar.
name: Verileri güncelle ve yayınla

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      degisti: ${{ steps.kaydet.outputs.degisti }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TBF verilerini çek
        # Zamanlanmış çalışmalar sadece maç saatlerinde veri çeker
        run: python fetch_tbf.py ${{ github.event_name == 'schedule' && '--akilli' || '' }}

      - name: Kadroları işle
        # Hatalı bir kadro satırı veri güncellemeyi durdurmasın; hata bu adımda görünür
        continue-on-error: true
        run: python kadro_hazirla.py

      - name: Değişiklikleri kaydet
        id: kaydet
        run: |
          git config user.name "tbl-fantezi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "degisti=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Veriler güncellendi"
            git pull --rebase
            git push
            echo "degisti=true" >> "$GITHUB_OUTPUT"
          fi

  yayinla:
    needs: guncelle
    if: needs.guncelle.outputs.degisti == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: yayin
        uses: actions/deploy-pages@v4
